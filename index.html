<!doctype html>
<html lang="en" class="dark">
  <head>
    <script>
      (function() {
        // Suppress any dev-server Vite WebSocket connection warnings/rejections in sandboxed container
        window.addEventListener('unhandledrejection', function(event) {
          const reasonStr = String(event.reason?.message || event.reason || '');
          if (reasonStr.includes('WebSocket') || reasonStr.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = String(event.message || '');
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return false;
          }
        }, true);

        const origError = console.error;
        console.error = function(...args) {
          const firstArg = typeof args[0] === 'string' ? args[0] : (args[0]?.message || String(args[0] || ''));
          if (firstArg.includes('[vite]') || firstArg.includes('WebSocket')) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          const firstArg = typeof args[0] === 'string' ? args[0] : (args[0]?.message || String(args[0] || ''));
          if (firstArg.includes('[vite]') || firstArg.includes('WebSocket')) {
            return;
          }
          origWarn.apply(console, args);
        };
      })();
    </script>
